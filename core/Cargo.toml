[package]
name = "basic"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
rand = "0.8.5"
hex = "0.4.3"
libp2p = "0.56.0"
log = "0.4.28"
once_cell = "1.21.3"
pretty_env_logger = "0.5.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = "1.48.0"
zeroize = { version = "1.8.2", features = ["derive"] }
bs58 = "0.5.1"
ripemd = "0.1.3"
primitive-types = { version = "0.14.0", features = ["serde"] }
uint = "0.10.0"
